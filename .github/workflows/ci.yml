# 自动检查：每次推送和合并请求都跑一遍，另外每周一跑一次，赶上 Claude Code 插件接口改动时早点发现。
# 检查（Linux）：代码检查、Python 测试、插件测试和插件清单检查，再把她的各种状态渲染成图片，打包在运行结果里。
# 打包（Windows）：跑一遍 installer/build.py，确认安装程序还能做出来，安装程序也打包在运行结果里。
name: 检查

on:
  push:
  pull_request:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 测试与截图
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buddy-pet
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: 安装依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends fonts-wqy-zenhei libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          python -m pip install -q ruff==0.17.2 PyQt5 Pillow
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code
      - name: 代码检查
        # 只查会出错的写法（没定义的名字、没用到的导入、常见陷阱）；B905 要 zip 写明 strict，这里的 zip 本来就是相邻两项配对。
        run: ruff check --select F,E9,B --ignore B905 .
      - name: Python 测试
        run: python -m unittest discover -s tests -v
      - name: 插件测试
        run: claude plugin test claude-plugin
      - name: 插件清单检查
        run: claude plugin validate claude-plugin
      - name: 渲染各种状态
        run: |
          python pet.pyw --snapshot "$RUNNER_TEMP/snapshot"
          test -s "$RUNNER_TEMP/snapshot/sheet.png"
          echo "渲染了 $(ls "$RUNNER_TEMP/snapshot" | wc -l) 张图，总览是 sheet.png。" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: snapshot
          path: ${{ runner.temp }}/snapshot

  windows:
    name: Windows 打包
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: buddy-pet
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install -q pyinstaller PyQt5 Pillow
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Python 测试
        run: python -m unittest discover -s tests -v
      - name: 打包
        run: |
          python installer\build.py
          Copy-Item "dist\Claude娘-安装程序.exe" "dist\claude-musume-setup.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: installer
          path: buddy-pet/dist/claude-musume-setup.exe
